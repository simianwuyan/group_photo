<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>版本对照 probe</title></head>
<body>
<pre id="log"></pre>
<script type="module">
const $ = (id) => document.getElementById(id);
const log = (t) => { $('log').innerHTML += t + '\n'; };
const wasmBase = location.search.includes('v=new') ? 'vendor/tasks-vision/wasm' : 'test-tv0.10.14/wasm';
const label = wasmBase.startsWith('vendor') ? '1.2.3' : '0.10.14';

// 双版本 bundle：probe 页面按 ?bundle= 动态 import
const bundlePath = location.search.includes('v=new')
  ? './vendor/tasks-vision/vision_bundle.mjs'
  : './test-tv0.10.14/vision_bundle.mjs';
const { FaceLandmarker, FilesetResolver } = await import(bundlePath);

try {
  const fileset = await FilesetResolver.forVisionTasks(wasmBase);
  const lm = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: 'models/face_landmarker.task', delegate: 'CPU' },
    runningMode: 'IMAGE', numFaces: 30,
    outputFacialTransformationMatrixes: true,
  });
  log(`[${label}] createLandmarker OK → PASS`);
  document.title = 'PROBE-PASS';
} catch (e) {
  log(`[${label}] 失败: ${String(e).slice(0, 300)}`);
  document.title = 'PROBE-FAIL';
}
</script>
</body>
</html>
